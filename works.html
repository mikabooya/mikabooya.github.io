      /* ── Page-specific ── */
      .wrap { max-width: 1200px; padding: 48px 24px 80px; }

      .hero { text-align: center; margin-bottom: 28px; }
      .hero h1 {
        font-size: clamp(2.5rem, 6vw, 4rem);
        line-height: 1;
        margin: 0;
        text-transform: lowercase;
        font-weight: 700;
        background: linear-gradient(120deg, var(--pink), var(--lavender), var(--gold));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: -0.03em;
      }

      /* Finder window */
      .wrap-narrow { max-width: 1100px; margin: 0 auto; }
      .finder-window {
        background: var(--card-bg);
        border: 1px solid var(--stroke);
        border-radius: 16px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .fw-titlebar {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--stroke);
        background: linear-gradient(180deg, rgba(0,0,0,.03), transparent);
      }
      .fw-title  { color: var(--ink-2); font-weight: 600; }
      .fw-actions { opacity: 0.7; }
      .dots { display: flex; align-items: center; gap: 8px; }
      .dot  { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
      .dot.red    { background: #ff5f57; }
      .dot.yellow { background: #ffbd2e; }
      .dot.green  { background: #28c840; }

      .fw-body {
        display: grid;
        grid-template-columns: 230px 1fr;
        min-height: 520px;
      }
      .fw-sidebar {
        border-right: 1px solid var(--stroke);
        padding: 16px 14px;
        background: rgba(0,0,0,.03);
      }
      body.dark-mode .fw-sidebar { background: rgba(255,255,255,.03); }
      .fw-sidebar h4 { margin: 10px 8px 6px; font-size: .9rem; color: var(--ink-2); text-transform: lowercase; letter-spacing: .03em; }
      .fw-sidebar ul { margin: 0 0 10px; padding: 0; list-style: none; }
      .fw-sidebar li { padding: 8px 10px; border-radius: 10px; color: var(--ink-2); }
      .fw-sidebar li:hover { background: rgba(0,0,0,.05); }
      body.dark-mode .fw-sidebar li:hover { background: rgba(255,255,255,.06); }
      .fw-sidebar li::first-letter { color: var(--pink); }

      .fw-main    { padding: 18px 20px 24px; }
      .fw-heading { margin: 6px 0 18px; font-size: 2.1rem; letter-spacing: -.02em; color: var(--ink); }

      .fw-grid { display: grid; gap: 22px; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }

      .folder {
        --folder: var(--pink);
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 14px;
        border: 1px solid var(--stroke);
        border-radius: 14px;
        background: var(--card-bg);
        text-decoration: none;
        box-shadow: 0 6px 18px rgba(0,0,0,.04);
        transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      }
      .folder:hover {
        --folder: #f7b6d0;
        transform: translateY(-3px);
        box-shadow: 0 14px 30px rgba(246,68,184,.15);
        border-color: rgba(246,68,184,.35);
      }
      .folder:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
      .folder .icon   { width: 88px; height: 66px; color: var(--folder); filter: drop-shadow(0 4px 10px rgba(0,0,0,.06)); transition: color .25s ease; }
      .folder .name   { font-weight: 600; color: var(--ink); text-transform: lowercase; }
      .folder .meta   { font-size: .9rem; color: var(--ink-2); }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid var(--stroke);
        background: rgba(0,0,0,.03);
        font-size: .75rem;
        color: var(--ink-2);
      }
      body.dark-mode .badge { background: rgba(255,255,255,.04); }

      footer {
        margin-top: 80px;
        border-top: 1px solid var(--stroke);
        padding: 40px 0;
      }

      @media (max-width: 820px) {
        .fw-body { grid-template-columns: 1fr; }
        .fw-sidebar { display: none; }
      }
    </style>
