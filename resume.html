    <style>
      /* ── Page-specific ── */
      .wrap { max-width: 980px; }

      .page-title {
        font-size: clamp(42px, 7vw, 68px);
        font-weight: 700;
        text-align: center;
        margin: 0 0 28px;
        background: linear-gradient(135deg, var(--pink), var(--lavender));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: -0.02em;
      }
      .subtitle {
        text-align: center;
        margin: -6px 0 28px;
        color: var(--ink-2);
        text-transform: lowercase;
        font-weight: 500;
      }

      .window {
        background: var(--card-bg);
        border: 1px solid var(--stroke);
        border-radius: 16px;
        box-shadow: var(--shadow);
        overflow: hidden;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        transition: transform 0.26s ease, box-shadow 0.26s ease, border-color 0.26s;
      }
      .window:hover {
        transform: translateY(-4px);
        box-shadow: 0 18px 45px rgba(0,0,0,.12);
        border-color: rgba(246,68,184,.22);
      }
      .window-content { padding: 24px; }

      .resume-link {
        color: var(--ink-2);
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        transition: color 0.3s ease;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .resume-link:hover { color: var(--pink); }

      .resume-img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 12px;
        border: 1px solid var(--stroke);
        box-shadow: 0 8px 24px rgba(0,0,0,.08);
        transition: transform 0.25s ease, box-shadow 0.25s ease;
      }
      .resume-img:hover {
        transform: scale(1.01);
        box-shadow: 0 12px 32px rgba(246,68,184,.15);
      }
      body.dark-mode .resume-img       { box-shadow: 0 8px 24px rgba(0,0,0,.3); }
      body.dark-mode .resume-img:hover { box-shadow: 0 12px 32px rgba(246,68,184,.35); }

      .note { margin-top: 14px; font-size: .95rem; color: var(--ink-2); text-transform: lowercase; }
      .note a { color: var(--pink); text-decoration: none; font-weight: 500; }
      .note a:hover { text-decoration: underline; }
    </style>
  </head>
